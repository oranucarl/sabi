[project]
name = "sabi"
version = "0.1.0"
description = "SAbi Tutor: a free, offline, voice-first tutor that sits beside any learning tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyQt6>=6.7",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "mss>=9.0",
    "Pillow>=10.4",
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "faster-whisper>=1.0.3",
    "edge-tts>=6.1.12",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "python-dotenv>=1.0",
    "pypdf>=4.3",
]

[project.optional-dependencies]
cloud = ["anthropic>=0.40"]

[project.scripts]
sabi = "sabi.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sabi*"]

[tool.setuptools.package-data]
sabi = ["data/*.json"]
